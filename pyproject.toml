[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibequery"
version = "0.1.0"
description = "Natural language to Redshift SQL."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "boto3>=1.34",
    "sqlparse>=0.5",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
vibequery = "vibequery.cli:main"
